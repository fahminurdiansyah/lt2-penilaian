
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#173d2b">
  <title>Uji Koneksi Google Forms</title>

  <style>
    :root {
      --green: #173d2b;
      --green-light: #e0f1e5;
      --bg: #f2f5f2;
      --border: #d5ddd5;
      --text: #202820;
      --muted: #657166;
    }

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: var(--bg);
      color: var(--text);
    }

    header {
      background: var(--green);
      color: white;
      padding: 24px 18px;
    }

    header h1 {
      margin: 0 0 7px;
      font-size: 22px;
    }

    header p {
      margin: 0;
      font-size: 14px;
      opacity: .85;
    }

    main {
      max-width: 520px;
      margin: auto;
      padding: 16px;
    }

    .card {
      background: white;
      border-radius: 14px;
      padding: 18px;
      margin-bottom: 14px;
      box-shadow: 0 2px 8px #0000000c;
    }

    label {
      display: block;
      font-weight: bold;
      margin-bottom: 10px;
    }

    input {
      display: block;
      width: 100%;
      min-height: 52px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 10px;
      font-size: 16px;
      background: white;
      color: var(--text);
    }

    input:focus {
      outline: 2px solid var(--green-light);
      border-color: var(--green);
    }

    .hint {
      color: var(--muted);
      font-size: 13px;
      line-height: 1.5;
    }

    .submit {
      width: 100%;
      min-height: 58px;
      border: 0;
      border-radius: 12px;
      background: var(--green);
      color: white;
      font-size: 17px;
      font-weight: bold;
      cursor: pointer;
      touch-action: manipulation;
    }

    .submit:disabled {
      opacity: .6;
      cursor: wait;
    }

    #status {
      background: white;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
      font-size: 14px;
      line-height: 1.5;
      overflow-wrap: anywhere;
    }

    footer {
      text-align: center;
      padding: 8px 16px 24px;
      color: var(--muted);
      font-size: 12px;
    }
  </style>
</head>

<body>
  <header>
    <h1>Uji Koneksi Google Forms</h1>
    <p>LT II Regol 2026 · Formulir Percobaan</p>
  </header>

  <main>
    <form id="ujiForm">

      <section class="card">
        <label for="lomba">Mata Lomba</label>
        <input
          id="lomba"
          type="text"
          placeholder="Contoh: E2"
          required
        >
      </section>

      <section class="card">
        <label for="peserta">Nomor Peserta</label>
        <input
          id="peserta"
          type="number"
          min="1"
          max="28"
          step="1"
          placeholder="Contoh: 7"
          required
        >
      </section>

      <section class="card">
        <label for="benar">Jumlah Jawaban Benar</label>
        <input
          id="benar"
          type="number"
          min="0"
          step="1"
          placeholder="Contoh: 15"
          required
        >
      </section>

      <section class="card">
        <label for="ketepatan">Nilai Ketepatan</label>
        <input
          id="ketepatan"
          type="number"
          min="0"
          step="any"
          placeholder="Contoh: 60"
          required
        >
      </section>

      <section class="card">
        <label for="sikap">Nilai Sikap</label>
        <input
          id="sikap"
          type="number"
          min="0"
          step="any"
          placeholder="Contoh: 20"
          required
        >
      </section>

      <section class="card">
        <label for="akhir">Nilai Akhir</label>
        <input
          id="akhir"
          type="number"
          min="0"
          step="any"
          placeholder="Contoh: 80"
          required
        >
      </section>

      <section class="card">
        <button class="submit" id="simpan" type="submit">
          Kirim Data
        </button>

        <p id="status" role="status" aria-live="polite">
          Belum ada pengiriman.
        </p>

        <p class="hint">
          Setelah mengirim, periksa tab Respons Google Forms
          untuk memastikan data benar-benar diterima.
        </p>
      </section>

    </form>
  </main>

  <footer>
    Prototipe LT II Regol 2026
  </footer>

  <script>
    // URL GOOGLE FORM UJI
    const GOOGLE_FORM_URL =
      "https://docs.google.com/forms/d/e/1FAIpQLSe1qSFeu5SvMp6JdAMDk66kyAQmJtwdHMnywVaml42oQMkPBw/formResponse";

    // ID PERTANYAAN GOOGLE FORMS
    const ENTRY = {
      lomba: "entry.511078072",
      peserta: "entry.1652413056",
      benar: "entry.1102203745",
      ketepatan: "entry.308553817",
      sikap: "entry.473179287",
      akhir: "entry.646836897"
    };

    const formUji = document.getElementById("ujiForm");
    const tombol = document.getElementById("simpan");
    const status = document.getElementById("status");

    formUji.addEventListener("submit", function(event) {
      event.preventDefault();

      if (tombol.disabled) return;

      // AMBIL NILAI DARI ENAM KOLOM
      const dataNilai = {
        lomba: document.getElementById("lomba").value.trim(),
        peserta: document.getElementById("peserta").value.trim(),
        benar: document.getElementById("benar").value.trim(),
        ketepatan: document.getElementById("ketepatan").value.trim(),
        sikap: document.getElementById("sikap").value.trim(),
        akhir: document.getElementById("akhir").value.trim()
      };

      // PASTIKAN SEMUA KOLOM TERISI
      if (Object.values(dataNilai).some(nilai => nilai === "")) {
        status.textContent =
          "Semua kolom wajib diisi sebelum mengirim.";
        return;
      }

      // PETAKAN NILAI KE ID GOOGLE FORMS
      const dataKirim = {
        [ENTRY.lomba]: dataNilai.lomba,
        [ENTRY.peserta]: dataNilai.peserta,
        [ENTRY.benar]: dataNilai.benar,
        [ENTRY.ketepatan]: dataNilai.ketepatan,
        [ENTRY.sikap]: dataNilai.sikap,
        [ENTRY.akhir]: dataNilai.akhir
      };

      // SIAPKAN IFRAME TERSEMBUNYI
      let frame = document.getElementById("google-form-frame");

      if (!frame) {
        frame = document.createElement("iframe");
        frame.id = "google-form-frame";
        frame.name = "google-form-frame";
        frame.style.display = "none";
        frame.title = "Pengiriman Google Forms";
        document.body.appendChild(frame);
      }

      // BUAT FORM PENGIRIMAN
      const formKirim = document.createElement("form");
      formKirim.method = "POST";
      formKirim.action = GOOGLE_FORM_URL;
      formKirim.target = frame.name;
      formKirim.style.display = "none";

      Object.entries(dataKirim).forEach(([nama, nilai]) => {
        const input = document.createElement("input");
        input.type = "hidden";
        input.name = nama;
        input.value = nilai;
        formKirim.appendChild(input);
      });

      document.body.appendChild(formKirim);

      tombol.disabled = true;
      tombol.textContent = "Mengirim...";
      status.textContent =
        "Permintaan pengiriman sedang dicoba. Periksa Respons Google Forms untuk memastikan data masuk.";

      formKirim.submit();
      formKirim.remove();

      // AKTIFKAN KEMBALI TOMBOL
      // Ini bukan konfirmasi penerimaan dari Google Forms.
      setTimeout(() => {
        tombol.disabled = false;
        tombol.textContent = "Kirim Data";
      }, 3000);
    });
  </script>
</body>
</html>
